# SehatSaathi backend. Run Fly commands from the backend directory.

app = "sehatsaathi-api-india"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DB_PROVIDER = "sqlite"
  DB_PATH = "/data/health.db"
  UPLOAD_DIR = "/data/uploads"
  BACKUP_DIR = "/data/backups"
  FILE_STORAGE_MODE = "local_persistent"
  JWT_EXPIRES_IN = "7d"
  REFRESH_TOKEN_EXPIRES_DAYS = "30"
  REPORT_EXTRACTION_PROVIDER = "auto"
  ABDM_ENABLED = "false"
  TRIAGE_MODEL_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[mounts]
  source = "sehatsaathi_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 14
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "5gb"
  auto_extend_size_limit = "50gb"

[checks]
  [checks.health]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 8080
    timeout = "5s"
    type = "http"
